sleep_start:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: "little_log"
    minutes_ago:
      required: false
      example: 15
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: "min"
          mode: "box"
    at_utc:
      required: false
      example: "2026-01-01 07:30:00"
      selector:
        datetime:
