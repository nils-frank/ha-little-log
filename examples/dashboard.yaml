# Example Little Log dashboard.
#
# Paste into a new dashboard's raw configuration editor:
#   Settings > Dashboards > Add dashboard > Edit > three-dot menu >
#   Raw configuration editor
#
# Uses only built-in cards, so it needs nothing from HACS beyond this
# integration. Every entity and action below ships with the integration; there
# is nothing to rename unless you gave the sensor a different entity id.
#
# This is also the dashboard the iOS Live Activity recipe in the README points
# at with `data.url`, since a Live Activity card cannot carry buttons itself.

views:
  - title: Baby
    path: baby
    icon: mdi:baby-face-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title

          - type: markdown
            content: >-
              {% set s = 'sensor.baby_state' %}

              {% set say = state_attr(s, 'say') or {} %}

              {% set mins = state_attr(s, 'elapsed_min') %}

              ## {{ 'Asleep' if is_state(s, 'asleep') else 'Awake' }}{% if mins
              is not none %} for {% if mins >= 60 %}{{ mins // 60 }} h {{ mins %
              60 }} min{% else %}{{ mins }} min{% endif %}{% endif %}

              {{ say.get('summary', '') }}

              {% if say.get('forecast') %}

              *{{ say.get('forecast') }}*

              {% endif %}

          - type: tile
            entity: sensor.baby_state
            name: State
            # `say` is German, as generated by the app. Swap in `elapsed_min` or
            # drop `state_content` if you would rather not see German here.
            state_content: state

      - type: grid
        cards:
          - type: heading
            heading: Sleep
            heading_style: title

          - type: button
            name: Toggle sleep
            icon: mdi:power-sleep
            icon_height: 48px
            tap_action:
              action: perform-action
              perform_action: little_log.sleep_toggle

          - type: button
            name: Woke up
            icon: mdi:sleep-off
            tap_action:
              action: perform-action
              perform_action: little_log.sleep_stop

          - type: button
            name: Fell asleep 15 min ago
            icon: mdi:clock-outline
            tap_action:
              action: perform-action
              perform_action: little_log.sleep_start
              data:
                minutes_ago: 15

      - type: grid
        cards:
          - type: heading
            heading: Feeding
            heading_style: title

          - type: button
            name: Bottle
            icon: mdi:baby-bottle-outline
            tap_action:
              action: perform-action
              perform_action: little_log.bottle

          - type: button
            name: Nursing
            icon: mdi:mother-nurse
            # `next` alternates from the last recorded side. Use `left`/`right`
            # on separate buttons if you would rather pick explicitly.
            tap_action:
              action: perform-action
              perform_action: little_log.nursing
              data:
                side: next

      - type: grid
        cards:
          - type: heading
            heading: Diaper
            heading_style: title

          - type: button
            name: Wet
            icon: mdi:water
            tap_action:
              action: perform-action
              perform_action: little_log.diaper
              data:
                kind: wet

          - type: button
            name: Dirty
            icon: mdi:emoticon-poop
            tap_action:
              action: perform-action
              perform_action: little_log.diaper
              data:
                kind: dirty

          - type: button
            name: Both
            icon: mdi:human-baby-changing-table
            tap_action:
              action: perform-action
              perform_action: little_log.diaper
              data:
                kind: both

      - type: grid
        cards:
          - type: heading
            heading: Other
            heading_style: title

          - type: button
            name: Yawn
            icon: mdi:sleep
            tap_action:
              action: perform-action
              perform_action: little_log.cue
              data:
                subtype: yawn

          - type: button
            name: Crying started
            icon: mdi:emoticon-cry-outline
            tap_action:
              action: perform-action
              perform_action: little_log.cry_start

          - type: button
            name: Crying stopped
            icon: mdi:emoticon-happy-outline
            tap_action:
              action: perform-action
              perform_action: little_log.cry_stop

          - type: button
            name: Undo
            icon: mdi:undo
            # Only reverses the last command from this token, within 10 minutes.
            tap_action:
              action: perform-action
              perform_action: little_log.undo

      - type: grid
        cards:
          - type: heading
            heading: Today
            heading_style: title

          - type: markdown
            content: >-
              {% set say = state_attr('sensor.baby_state', 'say') or {} %}

              {% for key in ['today', 'last_sleep', 'bottle', 'nursing',
              'diaper'] %}{% if say.get(key) %}

              - {{ say.get(key) }}

              {% endif %}{% endfor %}
